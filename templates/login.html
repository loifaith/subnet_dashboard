<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SN79 Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/asset/modern_favicon.ico" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("sn88-dashboard-theme");
          var explicit =
            localStorage.getItem("sn88-dashboard-theme-user-set") === "1";
          if (t === "light" && explicit) return;
          document.documentElement.classList.add("theme-dark");
        } catch (e) {
          document.documentElement.classList.add("theme-dark");
        }
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f6f8;
      }
      html.theme-dark body {
        background: #14161a;
        color: #e8e8e8;
      }
      html.theme-dark .card {
        background: #1c1e24;
        border-color: #2a2d34;
      }
      html.theme-dark .form-control {
        background: #14161a;
        border-color: #2a2d34;
        color: #e8e8e8;
      }
      html.theme-dark .form-control:focus {
        background: #14161a;
        color: #e8e8e8;
      }
      .login-card {
        width: 100%;
        max-width: 380px;
      }
    </style>
  </head>
  <body>
    <div class="card login-card p-4 shadow-sm">
      <h5 class="mb-3 text-center">SN79 Dashboard</h5>
      {% if error %}
      <div class="alert alert-danger py-2 px-3" style="font-size: 0.9rem">
        {{ error }}
      </div>
      {% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next or '' }}" />
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            required
            autofocus
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>
    </div>
  </body>
</html>
